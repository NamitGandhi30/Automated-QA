services:
  sidecar:
    build: ./docker/sidecar
    ports:
      - "${SIDE_CAR_PORT:-4777}:4777"
    environment:
      - PLAYWRIGHT_SERVICE_URL=http://playwright-runner:3000
      - TEST_RUNNER_URL=http://test-runner:5000
      - PORT=4777
    volumes:
      - "${WORKSPACE_ROOT:-.}:/app/workspace"
    networks:
      # aq-bridge: outbound internet (AI provider calls). aq-internal: reach the test-runner.
      - aq-bridge
      - aq-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4777/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  playwright-runner:
    build: ./docker/playwright-runner
    networks:
      - aq-bridge
    restart: unless-stopped

  test-runner:
    build: ./docker/test-runner
    volumes:
      - "${WORKSPACE_ROOT:-.}:/app/workspace"
    deploy:
      resources:
        limits:
          # Compiled-language toolchains (Rust/C++/Java) are memory-hungry when
          # compiling test binaries, so give the universal runner more headroom.
          cpus: '2.0'
          memory: 3072M
    networks:
      # ONLY the internal network — no internet. This guarantees hermetic test
      # runs: any unmocked external API/HTTP call fails fast instead of hanging,
      # so tests must fully mock their dependencies. The sidecar reaches it here.
      - aq-internal
    restart: unless-stopped

networks:
  aq-bridge:
    driver: bridge
  aq-internal:
    driver: bridge
    internal: true
